<style>
/* 🟥 1. 戦闘ウィンドウに限定した光る赤枠 */
#boss-frame {
    position: absolute; 
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; 
    z-index: 10; 
    box-sizing: border-box;
    border: 8px solid transparent; 
    border-radius: 20px 20px 0 0; 
    opacity: 0;
    transition: opacity 0.5s ease-in-out, border-color 0.5s;
}

/* 🔥 ボス出現時：ボケ幅を引き締め、エッジを鋭くした警告レイザー赤枠 */
#boss-frame.is-active {
    opacity: 1;
    border-color: rgba(255, 0, 0, 1.0); /* 完全に不透明な赤にしてクッキリ */
    
    /* ⚡【ボケ幅の修正】：15pxや30pxなどの狭い範囲で「濃い赤」を重ねることで、モヤモヤ感を消して強烈に発光させます */
    box-shadow: 
        0 0 15px rgba(255, 0, 0, 1.0),                  /* 外側への鋭い光 */
        0 0 30px rgba(255, 0, 0, 0.7),                  /* 外側への少し広い光 */
        inset 0 0 15px rgba(255, 0, 0, 1.0),            /* 内側への鋭い光 */
        inset 0 0 30px rgba(255, 0, 0, 0.7);            /* 内側への少し広い光 */
        
    animation: bossAlertPulse 1.5s infinite alternate ease-in-out;
}

@keyframes bossAlertPulse {
    0% { opacity: 0.8; }
    100% { opacity: 1.0; }
}

/* 💀 画面上部20%の位置に完全固定される警告タイトル */
#boss-title {
    position: fixed; 
    top: 20% !important; 
    left: 50% !important;
    transform: translate(-50%, -50%) !important; 
    color: #ffffff; /* 💡【超重要】：文字そのものを「純白」にすることで、赤文字より圧倒的にハッキリ読めるようになります！ */
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 2.8rem;
    font-weight: bold;
    letter-spacing: 4px;
    
    /* ⚡【文字のクッキリ化】：文字本体を白にし、その周りを「ボケていない1px〜3pxの超濃い赤」でガチガチに縁取り（ストローク）します */
    text-shadow: 
        -2px -2px 0 #ff0000,  2px -2px 0 #ff0000,
        -2px  2px 0 #ff0000,  2px  2px 0 #ff0000, /* 1. まず全方向に赤の硬い輪郭を作る */
        0 0 10px #ff0000, 0 0 20px #ff0000,        /* 2. その外側にじんわり赤のネオンを出す */
        0 0 5px #000000;                           /* 3. 隠し味に最背面に黒を置いて文字を浮き立たせる */
        
    z-index: 99999;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.3s ease-in-out;
}

/* クラスがついた瞬間だけ表示 */
#boss-title.is-active {
    opacity: 1; 
}
</style>

<script>
(function() {
    let hasPlayedBossSE = false;
    let bossTitleTimer = null; // 2秒タイマーを管理する変数

    function checkBossLogic() {
        const frame = document.getElementById("boss-frame");
        const title = document.getElementById("boss-title");
        const battleScreen = document.getElementById("scr-battle"); 
        const floorIndicator = document.getElementById("floor-indicator"); 
        // 🟢【ウィンドウ限定】親要素となる戦闘画像エリアを取得
        const effScr = document.getElementById("eff-scr"); 

        if (!frame || !title || !battleScreen || !floorIndicator || !effScr) return;

        // 🟢【ウィンドウ限定】赤枠を画面全体(body)から、戦闘画像エリア(#eff-scr)の中へ移動させる
        if (frame.parentNode !== effScr) {
            effScr.appendChild(frame);
        }

        // 戦闘画面が表示されていなければ、すべてを完全に初期化
        if (battleScreen.style.display === "none") {
            frame.classList.remove("is-active");
            title.classList.remove("is-active");
            hasPlayedBossSE = false;
            if (bossTitleTimer) { clearTimeout(bossTitleTimer); bossTitleTimer = null; }
            return;
        }

        try {
            // HTMLの階層表示バッジから数字を抜き出す
            const floorText = floorIndicator.textContent || floorIndicator.innerText;
            const currentFloor = parseInt(floorText.replace(/[^0-9]/g, ""), 10);
            
            // 10, 20, 30... 階のボスだった場合
            if (!isNaN(currentFloor) && currentFloor % 10 === 0 && currentFloor !== 0) {
                
// 1. 赤枠の起動（ついていなければ）
                if (!frame.classList.contains("is-active")) {
                    frame.classList.add("is-active");
                    
                    // 2. タイトルの起動と「2秒後に消す」タイマーのセット
                    title.classList.add("is-active");
                    if (bossTitleTimer) clearTimeout(bossTitleTimer);
                    bossTitleTimer = setTimeout(() => {
                        title.classList.remove("is-active"); // ⚡ 2秒後に文字だけスッと消滅
                    }, 2000);
                }

                // 3. 🎵 サウンド演出（地割れ＋落雷）を同時に1回だけ再生！
                if (!hasPlayedBossSE) {
                    hasPlayedBossSE = true; 

                    if (typeof startBGM === 'function') startBGM("boss"); // 👈 この1行をここに追加！

                    // ミュート状態のチェック
                    const muteBtn = document.getElementById("btn-mute");
                    const isMuted = muteBtn && muteBtn.textContent.includes("OFF");

                    if (!isMuted) {
                        // アセットパスの生成（関数がない場合は直リンクへフォールバック）
                        let shakePath = typeof getAssetPath === 'function' ? getAssetPath('se_clean', 'se_earthshake.mp3') : "";
                        let thunderPath = typeof getAssetPath === 'function' ? getAssetPath('se_clean', 'se_lightning01.mp3') : "";
                        
                        if (!shakePath) shakePath = "https://shadow-monk.github.io/spiral-tower2/assets/se/se_earthshake.mp3";
                        if (!thunderPath) thunderPath = "https://shadow-monk.github.io/spiral-tower2/assets/se/se_lightning01.mp3";

                        // 地割れ音再生
                        const seShake = new Audio(shakePath);
                        seShake.volume = 0.5;
                        seShake.play().catch(e => {});

                        // 落雷音再生
                        const seThunder = new Audio(thunderPath);
                        seThunder.volume = 0.5;
                        seThunder.play().catch(e => {});
                    }
                }
                return;
            }

            // 通常フロアなら演出を外す
            frame.classList.remove("is-active");
            title.classList.remove("is-active");
            hasPlayedBossSE = false;
            if (bossTitleTimer) { clearTimeout(bossTitleTimer); bossTitleTimer = null; }

        } catch(e) {
            // エラー対策
        }
    }

    // 0.1秒ごとに自動パトロール
    setInterval(checkBossLogic, 100);
})();
</script>
